{% extends "base.html" %}
{% block content %}
<h2>Manage Food Items</h2>
<a class="btn" href="{{ url_for('food_form') }}"><i class="fa-solid fa-plus"></i> Add Food Item</a>
<table>
  <tr><th>Name</th><th>Category</th><th>Price</th><th>Availability</th><th>Actions</th></tr>
  {% for f in foods %}
  <tr>
    <td>{{ f.food_name }}</td><td>{{ f.category }}</td><td>₹{{ f.price }}</td>
    <td><form class="inline" method="post" action="{{ url_for('toggle_food', food_id=f.food_id) }}">
      <button class="sm {{ 'green-btn' if f.availability == 'Available' else 'red-btn' }}">{{ f.availability }}</button></form></td>
    <td>
      <a class="sm-link" href="{{ url_for('food_form', food_id=f.food_id) }}"><i class="fa-solid fa-pen"></i> Edit</a>
      <form class="inline" method="post" action="{{ url_for('delete_food', food_id=f.food_id) }}" onsubmit="return confirm('Delete this item?')">
        <button class="sm red-btn"><i class="fa-solid fa-trash"></i></button></form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
