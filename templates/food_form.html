{% extends "base.html" %}
{% block content %}
<form class="card form" method="post" enctype="multipart/form-data">
  <h2>{{ 'Edit' if food else 'Add' }} Food Item</h2>
  <input name="food_name" placeholder="Food name" value="{{ food.food_name if food }}" required>
  <input name="description" placeholder="Description" value="{{ food.description if food }}">
  <input type="number" step="0.01" min="0" name="price" placeholder="Price" value="{{ food.price if food }}" required>
  <select name="category">{% for c in categories %}<option {{ 'selected' if food and food.category == c }}>{{ c }}</option>{% endfor %}</select>
  <select name="availability">
    <option {{ 'selected' if food and food.availability == 'Available' }}>Available</option>
    <option {{ 'selected' if food and food.availability == 'Out of Stock' }}>Out of Stock</option>
  </select>
  <label>Image (optional)</label>
  <input type="file" name="image" accept="image/*">
  <button class="btn">Save</button>
</form>
{% endblock %}
